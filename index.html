  <style>
    /* =========================================
       MENCEGAH SEMUA GAMBAR DI-DRAG
       ========================================= */
    img {
      -webkit-user-drag: none;
      user-drag: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
      pointer-events: auto;
    }

    /* =========================================
       ANIMASI LOGO
       ========================================= */
    .password-logo {
      animation:
        logoJumpIn 1s ease-out both,
        logoFloating 2.5s ease-in-out 1s infinite;
      transform-origin: center bottom;
      will-change: transform, opacity;
    }

    @keyframes logoJumpIn {
      0%   { opacity: 0; transform: translateY(70px) scale(0.75); }
      42%  { opacity: 1; transform: translateY(-25px) scale(1.08); }
      62%  { transform: translateY(8px) scale(0.97); }
      80%  { transform: translateY(-10px) scale(1.03); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes logoFloating {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }

    /* =========================================
       EFEK LOGO SAAT PASSWORD SALAH
       ========================================= */
    .password-image-error {
      animation: passwordImageError 0.9s cubic-bezier(.36,.07,.19,.97);
      filter:
        brightness(0.65)
        saturate(2.8)
        drop-shadow(0 0 10px rgba(255, 0, 0, 1))
        drop-shadow(0 0 25px rgba(255, 0, 0, 0.95))
        drop-shadow(0 0 45px rgba(255, 0, 0, 0.75));
    }

    @keyframes passwordImageError {
      0%   { transform: translateX(0) scale(1); }
      8%   { transform: translateX(-16px) scale(1.03); }
      16%  { transform: translateX(16px)  scale(1.03); }
      24%  { transform: translateX(-14px) scale(1.025); }
      32%  { transform: translateX(14px)  scale(1.025); }
      40%  { transform: translateX(-12px) scale(1.02); }
      48%  { transform: translateX(12px)  scale(1.02); }
      56%  { transform: translateX(-9px)  scale(1.015); }
      64%  { transform: translateX(9px)   scale(1.015); }
      72%  { transform: translateX(-6px)  scale(1.01); }
      80%  { transform: translateX(6px)   scale(1.01); }
      90%  { transform: translateX(-3px)  scale(1); }
      100% { transform: translateX(0)     scale(1); }
    }

    .password-screen-error {
      animation: passwordScreenError 0.9s ease-out;
    }

    @keyframes passwordScreenError {
      0% {
        background-color: rgba(255, 0, 0, 0);
        box-shadow: inset 0 0 0 rgba(255, 0, 0, 0);
      }
      10% {
        background-color: rgba(255, 0, 0, 0.48);
        box-shadow:
          inset 0 0 160px rgba(255, 0, 0, 0.85),
          inset 0 0 320px rgba(255, 0, 0, 0.65);
      }
      22% {
        background-color: rgba(150, 0, 0, 0.58);
        box-shadow:
          inset 0 0 100px rgba(255, 0, 0, 1),
          inset 0 0 260px rgba(255, 0, 0, 0.9),
          inset 0 0 500px rgba(255, 0, 0, 0.55);
      }
      38% {
        background-color: rgba(255, 0, 0, 0.35);
        box-shadow:
          inset 0 0 180px rgba(255, 0, 0, 0.95),
          inset 0 0 360px rgba(255, 0, 0, 0.7);
      }
      55% {
        background-color: rgba(255, 0, 0, 0.20);
        box-shadow:
          inset 0 0 120px rgba(255, 0, 0, 0.75),
          inset 0 0 300px rgba(255, 0, 0, 0.55);
      }
      75% {
        background-color: rgba(255, 0, 0, 0.10);
        box-shadow:
          inset 0 0 80px rgba(255, 0, 0, 0.45),
          inset 0 0 220px rgba(255, 0, 0, 0.30);
      }
      100% {
        background-color: rgba(255, 0, 0, 0);
        box-shadow: inset 0 0 0 rgba(255, 0, 0, 0);
      }
    }

    .password-screen-error::before {
      content: "";
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
      background:
        radial-gradient(
          ellipse at center,
          rgba(255, 0, 0, 0.05) 0%,
          rgba(255, 0, 0, 0.18) 45%,
          rgba(255, 0, 0, 0.55) 100%
        );
      animation: passwordRedOverlay 0.9s ease-out;
    }

    @keyframes passwordRedOverlay {
      0%   { opacity: 0; }
      12%  { opacity: 1; }
      25%  { opacity: 0.95; }
      45%  { opacity: 0.72; }
      65%  { opacity: 0.42; }
      82%  { opacity: 0.18; }
      100% { opacity: 0; }
    }

    .password-screen-error::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10000;
      border: 6px solid rgba(255, 0, 0, 0);
      box-sizing: border-box;
      animation: passwordBorderFlash 0.9s ease-out;
    }

    @keyframes passwordBorderFlash {
      0% {
        border-color: rgba(255, 0, 0, 0);
        box-shadow: inset 0 0 0 rgba(255, 0, 0, 0);
      }
      12% {
        border-color: rgba(255, 0, 0, 0.95);
        box-shadow: inset 0 0 45px rgba(255, 0, 0, 0.75);
      }
      30% {
        border-color: rgba(255, 0, 0, 0.85);
        box-shadow: inset 0 0 70px rgba(255, 0, 0, 0.65);
      }
      60% {
        border-color: rgba(255, 0, 0, 0.35);
        box-shadow: inset 0 0 35px rgba(255, 0, 0, 0.35);
      }
      100% {
        border-color: rgba(255, 0, 0, 0);
        box-shadow: inset 0 0 0 rgba(255, 0, 0, 0);
      }
    }

    .password-screen-error .password-error {
      animation: passwordErrorText 0.9s ease-out;
    }

    @keyframes passwordErrorText {
      0% {
        color: inherit;
        text-shadow: 0 0 0 rgba(255, 0, 0, 0);
      }
      15% {
        color: #ff0000;
        text-shadow:
          0 0 8px rgba(255, 0, 0, 1),
          0 0 18px rgba(255, 0, 0, 0.8);
      }
      35% {
        color: #ff2020;
        text-shadow:
          0 0 12px rgba(255, 0, 0, 1),
          0 0 25px rgba(255, 0, 0, 0.9);
      }
      100% {
        text-shadow: 0 0 0 rgba(255, 0, 0, 0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .password-screen-error::before,
      .password-screen-error::after,
      .password-screen-error,
      .password-image-error {
        animation-duration: 0.5s;
      }
    }

    /* =========================================
       CHAT BLINK ANIMATIONS
       ========================================= */
    @keyframes chatFabBlink {
      0%, 100% {
        box-shadow: 0 12px 28px rgba(30,64,175,.35), 0 0 0 0 rgba(239,68,68,.7);

        transform: scale(1);
        box-shadow: 0 3px 8px rgba(59,130,246,.25);

        transform: scale(1.06);
        box-shadow: 0 0 0 6px rgba(239,68,68,.22), 0 3px 12px rgba(239,68,68,.5);
      }
    }
    .chat-btn-blink {
      animation: chatBtnBlink 1.2s ease-in-out infinite !important;
    }

  <!-- ============================================================
       SILENCE CONSOLE — Sembunyikan log di console browser
       - Default: SENYAP (hanya console.error yang tampil)
       - Untuk lihat log: buka dengan ?debug=1 di URL
       - Atau ketik di console: __ENABLE_LOGS()
       ============================================================ -->
  <script>
    (function silentConsoleByDefault() {
      if (typeof console === 'undefined') return;

      const original = {
        log:   console.log.bind(console),
        warn:  console.warn.bind(console),
        info:  console.info.bind(console),
        debug: console.debug.bind(console),
      };

      let isDebug =
        new URLSearchParams(location.search).get('debug') === '1' ||
        location.hash === '#debug';

      function applyMode() {
        if (isDebug) {
          console.log   = original.log;
          console.warn  = original.warn;
          console.info  = original.info;
          console.debug = original.debug;
        } else {
          console.log   = function () {};
          console.warn  = function () {};
          console.info  = function () {};
          console.debug = function () {};
        }
      }
      applyMode();

      /* Helper global: nyalakan log via console */
      window.__ENABLE_LOGS = function () {
        isDebug = true;
        applyMode();
        original.log('%c[LOGS ENABLED]', 'color:#22c55e;font-weight:bold;');
      };

      /* Helper global: matikan log via console */
      window.__DISABLE_LOGS = function () {
        isDebug = false;
        applyMode();
      };
    })();
  </script>
