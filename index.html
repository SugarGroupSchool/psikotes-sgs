    /* =========================================
       MENCEGAH SEMUA GAMBAR DI-DRAG
       ========================================= */
    img {
      -webkit-user-drag: none;

      -webkit-user-select: none;

    /* =========================================
       ANIMASI LOGO
       ========================================= */
    .password-logo {
      animation:
        logoJumpIn 1s ease-out both,
        logoFloating 2.5s ease-in-out 1s infinite;
      transform-origin: center bottom;
      will-change: transform, opacity;
    }

    @keyframes logoJumpIn {
      0%   { opacity: 0; transform: translateY(70px) scale(0.75); }
      42%  { opacity: 1; transform: translateY(-25px) scale(1.08); }
      62%  { transform: translateY(8px) scale(0.97); }
      80%  { transform: translateY(-10px) scale(1.03); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes logoFloating {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }

    /* =========================================
       EFEK LOGO SAAT PASSWORD SALAH
       ========================================= */
    .password-image-error {
      animation: passwordImageError 0.9s cubic-bezier(.36,.07,.19,.97);
      filter:
        brightness(0.65)
        saturate(2.8)
        drop-shadow(0 0 10px rgba(255, 0, 0, 1))
        drop-shadow(0 0 25px rgba(255, 0, 0, 0.95))
        drop-shadow(0 0 45px rgba(255, 0, 0, 0.75));
    }

    @keyframes passwordImageError {
      0%   { transform: translateX(0) scale(1); }
      8%   { transform: translateX(-16px) scale(1.03); }
      16%  { transform: translateX(16px)  scale(1.03); }
      24%  { transform: translateX(-14px) scale(1.025); }
      32%  { transform: translateX(14px)  scale(1.025); }
      40%  { transform: translateX(-12px) scale(1.02); }
      48%  { transform: translateX(12px)  scale(1.02); }
      56%  { transform: translateX(-9px)  scale(1.015); }
      64%  { transform: translateX(9px)   scale(1.015); }
      72%  { transform: translateX(-6px)  scale(1.01); }
      80%  { transform: translateX(6px)   scale(1.01); }
      90%  { transform: translateX(-3px)  scale(1); }
      100% { transform: translateX(0)     scale(1); }
    }

    .password-screen-error {
      animation: passwordScreenError 0.9s ease-out;
    }

    @keyframes passwordScreenError {
      0%   { background-color: rgba(255,0,0,0);    box-shadow: inset 0 0 0 rgba(255,0,0,0); }
      10%  { background-color: rgba(255,0,0,.48);  box-shadow: inset 0 0 160px rgba(255,0,0,.85), inset 0 0 320px rgba(255,0,0,.65); }
      22%  { background-color: rgba(150,0,0,.58);  box-shadow: inset 0 0 100px rgba(255,0,0,1), inset 0 0 260px rgba(255,0,0,.9), inset 0 0 500px rgba(255,0,0,.55); }
      38%  { background-color: rgba(255,0,0,.35);  box-shadow: inset 0 0 180px rgba(255,0,0,.95), inset 0 0 360px rgba(255,0,0,.7); }
      55%  { background-color: rgba(255,0,0,.20);  box-shadow: inset 0 0 120px rgba(255,0,0,.75), inset 0 0 300px rgba(255,0,0,.55); }
      75%  { background-color: rgba(255,0,0,.10);  box-shadow: inset 0 0 80px rgba(255,0,0,.45), inset 0 0 220px rgba(255,0,0,.3); }
      100% { background-color: rgba(255,0,0,0);    box-shadow: inset 0 0 0 rgba(255,0,0,0); }
    }

    .password-screen-error::before {
      content: "";
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
      background: radial-gradient(
        ellipse at center,
        rgba(255,0,0,.05) 0%,
        rgba(255,0,0,.18) 45%,
        rgba(255,0,0,.55) 100%
      );
      animation: passwordRedOverlay 0.9s ease-out;
    }

    @keyframes passwordRedOverlay {
      0%   { opacity: 0; }
      12%  { opacity: 1; }
      25%  { opacity: .95; }
      45%  { opacity: .72; }
      65%  { opacity: .42; }
      82%  { opacity: .18; }
      100% { opacity: 0; }
    }

    .password-screen-error::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10000;
      border: 6px solid rgba(255,0,0,0);
      box-sizing: border-box;
      animation: passwordBorderFlash 0.9s ease-out;
    }

    @keyframes passwordBorderFlash {
      0%   { border-color: rgba(255,0,0,0);    box-shadow: inset 0 0 0 rgba(255,0,0,0); }
      12%  { border-color: rgba(255,0,0,.95);  box-shadow: inset 0 0 45px rgba(255,0,0,.75); }
      30%  { border-color: rgba(255,0,0,.85);  box-shadow: inset 0 0 70px rgba(255,0,0,.65); }
      60%  { border-color: rgba(255,0,0,.35);  box-shadow: inset 0 0 35px rgba(255,0,0,.35); }
      100% { border-color: rgba(255,0,0,0);    box-shadow: inset 0 0 0 rgba(255,0,0,0); }
    }

    .password-screen-error .password-error {
      animation: passwordErrorText 0.9s ease-out;
    }

    @keyframes passwordErrorText {
      0%   { color: inherit; text-shadow: 0 0 0 rgba(255,0,0,0); }
      15%  { color: #ff0000; text-shadow: 0 0 8px rgba(255,0,0,1), 0 0 18px rgba(255,0,0,.8); }
      35%  { color: #ff2020; text-shadow: 0 0 12px rgba(255,0,0,1), 0 0 25px rgba(255,0,0,.9); }
      100% { text-shadow: 0 0 0 rgba(255,0,0,0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .password-screen-error::before,
      .password-screen-error::after,
      .password-screen-error,
      .password-image-error {
        animation-duration: 0.5s;
      }
    }

  <!-- ============================================================
       SILENCE CONSOLE — Sembunyikan log di console browser
       - Default: SENYAP (hanya console.error yang tampil)
       - Untuk lihat log: buka dengan ?debug=1 di URL
       - Atau ketik di console: __ENABLE_LOGS()
       ============================================================ -->
  <script>
    (function silentConsoleByDefault() {
      if (typeof console === 'undefined') return;

      const original = {
        log:   console.log.bind(console),
        warn:  console.warn.bind(console),
        info:  console.info.bind(console),
        debug: console.debug.bind(console),
      };

      let isDebug =
        new URLSearchParams(location.search).get('debug') === '1' ||
        location.hash === '#debug';

      function applyMode() {
        if (isDebug) {
          console.log   = original.log;
          console.warn  = original.warn;
          console.info  = original.info;
          console.debug = original.debug;
        } else {
          console.log   = function () {};
          console.warn  = function () {};
          console.info  = function () {};
          console.debug = function () {};
        }
      }
      applyMode();

      window.__ENABLE_LOGS = function () {
        isDebug = true;
        applyMode();
        original.log('%c[LOGS ENABLED]', 'color:#22c55e;font-weight:bold;');
      };

      window.__DISABLE_LOGS = function () {
        isDebug = false;
        applyMode();
      };
    })();
  </script>

  <!-- ============================================================
       🔍 SELF-CHECK — Verifikasi semua dependency tersedia
       (aktifkan dengan ?debug=1)
       ============================================================ -->
  <script>
    (function selfCheck() {
      const isDebug = new URLSearchParams(location.search).get('debug') === '1';
      if (!isDebug) return;

      setTimeout(function () {
        const checks = [
          ['APP_CONFIG',               typeof window.APP_CONFIG !== 'undefined'],
          ['appState',                 typeof window.appState !== 'undefined'],
          ['tests (global)',           typeof window.tests !== 'undefined'],
          ['GRAFIS_AUTO_DATA',         typeof window.GRAFIS_AUTO_DATA !== 'undefined'],
          ['GRAFIS_SCORING v9.0',      typeof window.GRAFIS_SCORING !== 'undefined'],
          ['GRAFIS_SCORING.VERSION',   window.GRAFIS_SCORING?.VERSION || '-'],
          ['GRAFIS_DATA',              typeof window.GRAFIS_DATA !== 'undefined'],
          ['BAUM slides',              window.GRAFIS_AUTO_DATA?.baum?.slides?.length || 0],
          ['DAP slides',               window.GRAFIS_AUTO_DATA?.dap?.slides?.length || 0],
          ['HTP slides',               window.GRAFIS_AUTO_DATA?.htp?.slides?.length || 0],
          ['firebase',                 typeof firebase !== 'undefined'],
          ['jsPDF',                    typeof window.jspdf !== 'undefined'],
          ['Luckysheet',               typeof window.luckysheet !== 'undefined'],
          ['JSZip',                    typeof window.JSZip !== 'undefined'],
          ['SheetJS',                  typeof window.XLSX !== 'undefined'],
          ['renderGrafisUpload',       typeof window.renderGrafisUpload === 'function'],
          ['openGrafisInterpLink',     typeof window.openGrafisInterpLink === 'function'],
          ['openInterviewLink',        typeof window.openInterviewLink === 'function'],
          ['generatePDFBlob',          typeof window.generatePDFBlob === 'function'],
          ['checkPassword',            typeof window.checkPassword === 'function'],
        ];

        const style = 'font-weight:bold;padding:2px 6px;border-radius:4px;';
        console.log('%c[SELF-CHECK] Dependency Verification', 'color:#6366f1;font-size:14px;font-weight:900;');
        console.log('─'.repeat(60));

        let allOk = true;
        checks.forEach(function (row) {
          const [name, value] = row;
          const ok = value !== false && value !== 0 && value !== '-' && value !== undefined;
          if (!ok) allOk = false;
          const icon = ok ? '✅' : '❌';
          const color = ok ? '#22c55e' : '#ef4444';
          console.log(
            '%c' + icon + ' ' + name.padEnd(28) + ' %c' + String(value),
            style + 'background:' + color + ';color:#fff;',
            'color:#475569;font-family:monospace;'
          );
        });

        console.log('─'.repeat(60));
        console.log(
          allOk
            ? '%c✅ SEMUA DEPENDENCY OK — Aplikasi siap digunakan'
            : '%c⚠️ ADA DEPENDENCY YANG HILANG — cek log di atas',
          'font-weight:900;font-size:12px;color:' + (allOk ? '#16a34a' : '#dc2626') + ';'
        );
        console.log(
          '%c💡 Buka form admin dengan: ?grafindo=1&n=NamaKandidat&p=Posisi',
          'color:#6366f1;font-style:italic;'
        );
      }, 3000);
    })();
  </script>
