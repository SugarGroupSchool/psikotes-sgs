  <!-- ============================================================

  <style id="critical-css">
/* =========================================================
   DESIGN TOKENS
   ---------------------------------------------------------
   Semua CSS variable global untuk aplikasi psikotes SGS.
   Dimuat paling awal (sebelum file CSS komponen apapun).
   ========================================================= */
:root {
  /* =========================================================
     WARNA UTAMA
     ========================================================= */
  --primary:   #2c3e50;
  --secondary: #3498db;
  --accent:    #27ae60;
  --warning:   #f39c12;
  --danger:    #e74c3c;
  --light:     #f5f7fa;
  --dark:      #2c3e50;

  /* =========================================================
     SHADOWS & TRANSITIONS
     ========================================================= */
  --shadow:     0 4px 20px rgba(0, 0, 0, .08);
  --shadow-md:  0 10px 34px rgba(44, 123, 229, .10);
  --shadow-lg:  0 18px 50px rgba(15, 23, 42, .075);
  --transition: all .4s cubic-bezier(.175, .885, .32, 1.275);

  /* =========================================================
     PALETTE MODERN — IST / New UI
     ========================================================= */
  --ist-primary:   #5b5cf0;
  --ist-primary-2: #7c3aed;
  --ist-cyan:      #06b6d4;
  --ist-green:     #22c55e;
  --ist-text:      #172033;
  --ist-muted:     #667085;
  --ist-border:    #e6e8f0;

  /* =========================================================
     PALETTE KRAEPLIN — Premium Luxury (Navy + Gold)
     ---------------------------------------------------------
     Sebelumnya didefinisikan di 07-kraeplin.css.
     Sekarang dipusatkan di sini untuk konsistensi token.
     ========================================================= */
  /* Base Kraeplin */
  --kp-primary:   #6366f1;
  --kp-primary-2: #8b5cf6;
  --kp-secondary: #06b6d4;
  --kp-success:   #10b981;
  --kp-danger:    #ef4444;
  --kp-dark:      #0f172a;
  --kp-text:      #1e293b;
  --kp-muted:     #64748b;

  /* Navy scale */
  --kp-navy-900: #0a1124;
  --kp-navy-800: #101a35;
  --kp-navy-700: #1a2547;
  --kp-navy-600: #253660;
  --kp-navy-500: #334877;

  /* Gold scale */
  --kp-gold-400: #fbbf24;
  --kp-gold-500: #f59e0b;
  --kp-gold-600: #d97706;

  /* Emerald scale */
  --kp-emerald-400: #34d399;
  --kp-emerald-500: #10b981;
  --kp-emerald-600: #059669;

  /* Rose scale */
  --kp-rose-400: #f87171;
  --kp-rose-500: #ef4444;
  --kp-rose-600: #dc2626;

  /* =========================================================
     ✅ FIX [2026-10-05]: Transisi Kraeplin
     ---------------------------------------------------------
     Sebelumnya variabel ini tidak terdefinisi, sehingga
     `transition: var(--kp-transition);` di 07-kraeplin.css
     menjadi invalid → animasi hover Kraeplin tidak berjalan.
     ========================================================= */
  --kp-transition:      all .35s cubic-bezier(.2, .8, .2, 1);
  --kp-transition-fast: all .18s ease;

  /* =========================================================
     RADIUS
     ========================================================= */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --radius-xl: 24px;

  /* =========================================================
     Z-INDEX SCALE
     ---------------------------------------------------------
     Gunakan variabel ini agar urutan layer konsisten.
     ========================================================= */
  --z-base:         1;
  --z-dropdown:     100;
  --z-sticky:       500;
  --z-modal:        1000;
  --z-modal-nested: 1500;
  --z-toast:        2000;
  --z-anti-cheat:   9999;
  --z-critical:     2147483647;

  /* =========================================================
     SPACING SCALE
     ========================================================= */
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-8:  32px;
  --space-10: 40px;
}


/* ===== NEXT FILE ===== */

/* =========================================================
   RESET & BASE
   ========================================================= */
   * { margin: 0; padding: 0; box-sizing: border-box; }

   html { -webkit-text-size-adjust: 100%; }
   
   body {
     font-family: 'Poppins','Segoe UI',Tahoma,Verdana,sans-serif;
     background: linear-gradient(135deg,#f5f7fa 0%,#e4efe9 100%);
     color: #333;
     line-height: 1.6;
     min-height: 100vh;
     overflow-x: hidden;
     position: relative;
   }
   
   body::before {
     content: "";
     position: absolute; inset: 0;
     background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="none" stroke="rgba(52,152,219,0.03)" stroke-width="1"/></svg>');
     z-index: -1;
   }
   
   img {
     -webkit-user-drag: none;
     user-drag: none;
     -webkit-user-select: none;
     -moz-user-select: none;
     user-select: none;
     pointer-events: auto;
     max-width: 100%;
     height: auto;
   }
   
   /* =========================================================
      APP CONTAINER
      ========================================================= */
   #app {
     display: flex;
     justify-content: center;
     align-items: center;
     min-height: 100vh;
     padding: 20px;
   }
   
   /* =========================================================
      CARD
      ========================================================= */
   .card {
     background: white;
     padding: 40px;
     border-radius: 20px;
     box-shadow: var(--shadow);
     width: 100%;
     max-width: 900px;
     transition: var(--transition);
     position: relative;
     overflow: hidden;
   }
   .card::before {
     content: "";
     position: absolute; top: 0; left: 0; right: 0;
     height: 5px;
     background: linear-gradient(90deg,var(--secondary) 0%,var(--accent) 100%);
   }
   
   /* =========================================================
      HEADER
      ========================================================= */
   .header { text-align: center; margin-bottom: 30px; }
   .header img {
     display: block; margin: 0 auto 20px;
     max-width: 220px;
     filter: drop-shadow(0 5px 15px rgba(0,0,0,.1));
   }
   .header h1 {
     color: var(--primary);
     margin-bottom: 10px;
     font-size: 32px;
     position: relative;
     display: inline-block;
   }
   .header h1::after {
     content: ""; position: absolute; bottom: -10px; left: 50%;
     transform: translateX(-50%);
     width: 80px; height: 4px;
     background: linear-gradient(90deg,var(--secondary) 0%,var(--accent) 100%);
     border-radius: 2px;
   }
   
   /* =========================================================
      BUTTONS
      ========================================================= */
   .btn {
     display: inline-block;
     padding: 14px 28px;
     background: linear-gradient(135deg,var(--secondary) 0%,#2980b9 100%);
     color: #fff;
     border: none;
     border-radius: 12px;
     font-size: 16px;
     font-weight: 600;
     cursor: pointer;
     transition: var(--transition);
     margin: 8px;
     text-decoration: none;
     box-shadow: 0 4px 15px rgba(0,0,0,.1);
     min-width: 180px;
     font-family: inherit;
   }
   .btn:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,.15); }
   .btn-completed { background: linear-gradient(135deg,var(--accent) 0%,#219653 100%); }
   .btn-warning   { background: linear-gradient(135deg,var(--warning) 0%,#e67e22 100%); }
   .btn-danger    { background: linear-gradient(135deg,var(--danger) 0%,#c0392b 100%); }
   .btn-outline   { background: transparent; border: 2px solid var(--secondary); color: var(--secondary); }
   .btn.green     { background: var(--accent); color:#fff; border:0; font-weight:800; padding:12px 24px; border-radius:11px; box-shadow:0 4px 18px #bff1d7; }
   .btn.green:hover { background: #0f8a4b; }
   
   /* =========================================================
      TIMER
      ========================================================= */
   .timer-container {
     position: fixed; top: 20px; right: 20px;
     background: #fff;
     padding: 12px 20px;
     border-radius: 12px;
     box-shadow: var(--shadow);
     z-index: 1000;
     display: flex;
     align-items: center;
     gap: 10px;
   }
   .timer { font-size: 24px; font-weight: bold; color: var(--primary); }
   .timer-icon { font-size: 20px; color: var(--secondary); }
   .timer-warning { color: var(--danger); animation: pulse .8s infinite alternate; }
   @keyframes pulse { from{transform:scale(1)} to{transform:scale(1.1)} }
   
   /* =========================================================
      PROGRESS BAR
      ========================================================= */
   .progress-container {
     width: 100%;
     background-color: #ecf0f1;
     border-radius: 12px;
     margin: 25px 0;
     height: 12px;
     overflow: hidden;
   }
   .progress-bar {
     height: 100%;
     background: linear-gradient(90deg,var(--secondary) 0%,var(--accent) 100%);
     border-radius: 12px;
     transition: width .5s ease;
     position: relative;
   }
   .progress-bar::after {
     content: ""; position: absolute; inset: 0;
     background: linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
     animation: progressShine 2s infinite;
   }
   @keyframes progressShine { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }
   
   /* =========================================================
      RESPONSIVE
      ========================================================= */
   @media (max-width: 768px) {
     .card { padding: 25px; }
     .timer-container { top:10px; right:10px; padding:10px 15px; }
     .timer { font-size: 20px; }
     .btn { min-width: auto; width: 100%; margin: 5px 0; }
   }
   @media (max-width: 480px) {
     .header h1 { font-size: 28px; }
   }

/* ===== NEXT FILE ===== */

/* =========================================================
   PASSWORD SCREEN
   ========================================================= */
   .password-screen {
    position: fixed; inset: 0;
    background: linear-gradient(135deg,#1a2a6c 0%,#2c3e50 100%);
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    z-index: 1000;
    transition: all .8s cubic-bezier(.65,0,.35,1);
    padding: 20px;
  }
  .password-screen.hidden {
    opacity: 0; pointer-events: none; transform: translateY(-30px);
  }
  
  .password-logo {
    width: 300px; height: 250px;
    margin-bottom: 30px;
    transition: var(--transition);
    will-change: transform, opacity;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,.3));
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0) }
    50%     { transform: translateY(-15px) }
  }
  .password-logo.small { width: 150px; height: 125px; margin-bottom: 15px; }
  
  .password-form {
    display: flex; flex-direction: column;
    align-items: center; gap: 15px;
    width: 100%; max-width: 400px;
    transition: var(--transition);
  }
  .password-input {
    padding: 15px 25px;
    border: 2px solid rgba(255,255,255,.3);
    border-radius: 12px;
    font-size: 16px; width: 100%;
    text-align: center;
    background: rgba(255,255,255,.1);
    color: #fff;
    transition: var(--transition);
    backdrop-filter: blur(5px);
    box-shadow: 0 4px 15px rgba(0,0,0,.1);
    font-family: inherit;
  }
  .password-input:focus {
    outline: none;
    border-color: var(--secondary);
    background: rgba(255,255,255,.2);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,.2);
  }
  .password-input::placeholder { color: rgba(255,255,255,.7); }
  
  .password-submit {
    padding: 15px 35px;
    background: linear-gradient(135deg,var(--secondary) 0%,#2980b9 100%);
    color: #fff; border: none; border-radius: 12px;
    font-size: 16px; font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    width: 100%;
    box-shadow: 0 4px 15px rgba(0,0,0,.15);
    letter-spacing: .5px;
    text-transform: uppercase;
    font-family: inherit;
  }
  .password-submit:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(0,0,0,.2);
    background: linear-gradient(135deg,#2980b9 0%,var(--secondary) 100%);
  }
  
  .password-error {
    color: #ff6b6b;
    margin-top: 10px;
    height: 20px;
    font-weight: 500;
    text-align: center;
  }
  
  .welcome-message {
    font-size: 28px; color: #fff;
    margin-bottom: 30px;
    text-align: center;
    opacity: 0; transform: translateY(20px);
    transition: all .6s ease .3s;
    font-weight: 600;
    text-shadow: 0 2px 10px rgba(0,0,0,.3);
    max-width: 800px; line-height: 1.4;
  }
  .welcome-message.show { opacity: 1; transform: translateY(0); }
  
  /* Error state */
  .password-image-error {
    animation: passwordImageError .9s cubic-bezier(.36,.07,.19,.97);
    filter: brightness(.65) saturate(2.8)
            drop-shadow(0 0 10px rgba(255,0,0,1))
            drop-shadow(0 0 25px rgba(255,0,0,.95))
            drop-shadow(0 0 45px rgba(255,0,0,.75));
  }
  @keyframes passwordImageError {
    0%   { transform: translateX(0) scale(1) }
    8%   { transform: translateX(-16px) scale(1.03) }
    16%  { transform: translateX(16px)  scale(1.03) }
    24%  { transform: translateX(-14px) scale(1.025) }
    32%  { transform: translateX(14px)  scale(1.025) }
    40%  { transform: translateX(-12px) scale(1.02) }
    48%  { transform: translateX(12px)  scale(1.02) }
    56%  { transform: translateX(-9px)  scale(1.015) }
    64%  { transform: translateX(9px)   scale(1.015) }
    72%  { transform: translateX(-6px)  scale(1.01) }
    80%  { transform: translateX(6px)   scale(1.01) }
    90%  { transform: translateX(-3px)  scale(1) }
    100% { transform: translateX(0)     scale(1) }
  }
  
  .password-screen-error { animation: passwordScreenError .9s ease-out; }
  @keyframes passwordScreenError {
    0%   { background-color: rgba(255,0,0,0);    box-shadow: inset 0 0 0 rgba(255,0,0,0) }
    10%  { background-color: rgba(255,0,0,.48);  box-shadow: inset 0 0 160px rgba(255,0,0,.85), inset 0 0 320px rgba(255,0,0,.65) }
    22%  { background-color: rgba(150,0,0,.58);  box-shadow: inset 0 0 100px rgba(255,0,0,1), inset 0 0 260px rgba(255,0,0,.9), inset 0 0 500px rgba(255,0,0,.55) }
    38%  { background-color: rgba(255,0,0,.35);  box-shadow: inset 0 0 180px rgba(255,0,0,.95), inset 0 0 360px rgba(255,0,0,.7) }
    55%  { background-color: rgba(255,0,0,.20);  box-shadow: inset 0 0 120px rgba(255,0,0,.75), inset 0 0 300px rgba(255,0,0,.55) }
    75%  { background-color: rgba(255,0,0,.10);  box-shadow: inset 0 0 80px rgba(255,0,0,.45), inset 0 0 220px rgba(255,0,0,.3) }
    100% { background-color: rgba(255,0,0,0);    box-shadow: inset 0 0 0 rgba(255,0,0,0) }
  }
  .password-screen-error::before {
    content: ""; position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    pointer-events: none; z-index: 9999;
    background: radial-gradient(ellipse at center, rgba(255,0,0,.05) 0%, rgba(255,0,0,.18) 45%, rgba(255,0,0,.55) 100%);
    animation: passwordRedOverlay .9s ease-out;
  }
  @keyframes passwordRedOverlay {
    0%{opacity:0} 12%{opacity:1} 25%{opacity:.95} 45%{opacity:.72}
    65%{opacity:.42} 82%{opacity:.18} 100%{opacity:0}
  }
  .password-screen-error::after {
    content: ""; position: fixed; inset: 0;
    pointer-events: none; z-index: 10000;
    border: 6px solid rgba(255,0,0,0);
    box-sizing: border-box;
    animation: passwordBorderFlash .9s ease-out;
  }
  @keyframes passwordBorderFlash {
    0%  { border-color: rgba(255,0,0,0);   box-shadow: inset 0 0 0 rgba(255,0,0,0) }
    12% { border-color: rgba(255,0,0,.95); box-shadow: inset 0 0 45px rgba(255,0,0,.75) }
    30% { border-color: rgba(255,0,0,.85); box-shadow: inset 0 0 70px rgba(255,0,0,.65) }
    60% { border-color: rgba(255,0,0,.35); box-shadow: inset 0 0 35px rgba(255,0,0,.35) }
    100%{ border-color: rgba(255,0,0,0);   box-shadow: inset 0 0 0 rgba(255,0,0,0) }
  }
  .password-screen-error .password-error { animation: passwordErrorText .9s ease-out; }
  @keyframes passwordErrorText {
    0%  { color: inherit; text-shadow: 0 0 0 rgba(255,0,0,0) }
    15% { color: #ff0000; text-shadow: 0 0 8px  rgba(255,0,0,1), 0 0 18px rgba(255,0,0,.8) }
    35% { color: #ff2020; text-shadow: 0 0 12px rgba(255,0,0,1), 0 0 25px rgba(255,0,0,.9) }
    100%{ text-shadow: 0 0 0 rgba(255,0,0,0) }
  }
  
  @media (max-width: 480px) {
    .password-logo { width: 220px; height: 180px; }
    .welcome-message { font-size: 22px; }
  }

  </style>

      100% { background-color: rgba(255,0,0,0);    box-shadow: inset 0 0 0 rgba(255,0,0,0); }
    }

    .password-screen-error::before {
      content: "";
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
      background: radial-gradient(
        ellipse at center,
        rgba(255,0,0,.05) 0%,
        rgba(255,0,0,.18) 45%,
        rgba(255,0,0,.55) 100%
      );
      animation: passwordRedOverlay 0.9s ease-out;
    }

    @keyframes passwordRedOverlay {
      0%   { opacity: 0; }
      12%  { opacity: 1; }
      25%  { opacity: .95; }
      45%  { opacity: .72; }
      65%  { opacity: .42; }
      82%  { opacity: .18; }
      100% { opacity: 0; }
    }

    .password-screen-error::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10000;
      border: 6px solid rgba(255,0,0,0);
      box-sizing: border-box;
      animation: passwordBorderFlash 0.9s ease-out;
    }

    @keyframes passwordBorderFlash {
      0%   { border-color: rgba(255,0,0,0);    box-shadow: inset 0 0 0 rgba(255,0,0,0); }
      12%  { border-color: rgba(255,0,0,.95);  box-shadow: inset 0 0 45px rgba(255,0,0,.75); }
      30%  { border-color: rgba(255,0,0,.85);  box-shadow: inset 0 0 70px rgba(255,0,0,.65); }
      60%  { border-color: rgba(255,0,0,.35);  box-shadow: inset 0 0 35px rgba(255,0,0,.35); }
      100% { border-color: rgba(255,0,0,0);    box-shadow: inset 0 0 0 rgba(255,0,0,0); }
    }

    .password-screen-error .password-error {
      animation: passwordErrorText 0.9s ease-out;
    }

    @keyframes passwordErrorText {
      0%   { color: inherit; text-shadow: 0 0 0 rgba(255,0,0,0); }
      15%  { color: #ff0000; text-shadow: 0 0 8px rgba(255,0,0,1), 0 0 18px rgba(255,0,0,.8); }
      35%  { color: #ff2020; text-shadow: 0 0 12px rgba(255,0,0,1), 0 0 25px rgba(255,0,0,.9); }
      100% { text-shadow: 0 0 0 rgba(255,0,0,0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .password-screen-error::before,
      .password-screen-error::after,
      .password-screen-error,
      .password-image-error {
        animation-duration: 0.5s;
      }
    }

  <!-- ============================================================
       SILENCE CONSOLE — Sembunyikan log di console browser
       - Default: SENYAP (hanya console.error yang tampil)
       - Untuk lihat log: buka dengan ?debug=1 di URL
       - Atau ketik di console: __ENABLE_LOGS()
       ============================================================ -->
  <script>
    (function silentConsoleByDefault() {
      if (typeof console === 'undefined') return;

      const original = {
        log:   console.log.bind(console),
        warn:  console.warn.bind(console),
        info:  console.info.bind(console),
        debug: console.debug.bind(console),
      };

      let isDebug =
        new URLSearchParams(location.search).get('debug') === '1' ||
        location.hash === '#debug';

      function applyMode() {
        if (isDebug) {
          console.log   = original.log;
          console.warn  = original.warn;
          console.info  = original.info;
          console.debug = original.debug;
        } else {
          console.log   = function () {};
          console.warn  = function () {};
          console.info  = function () {};
          console.debug = function () {};
        }
      }
      applyMode();

      window.__ENABLE_LOGS = function () {
        isDebug = true;
        applyMode();
        original.log('%c[LOGS ENABLED]', 'color:#22c55e;font-weight:bold;');
      };

      window.__DISABLE_LOGS = function () {
        isDebug = false;
        applyMode();
      };
    })();
  </script>
